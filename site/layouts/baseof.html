<!doctype html>
<html lang="en">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/site.js" | minify | fingerprint "sha256" -}}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>

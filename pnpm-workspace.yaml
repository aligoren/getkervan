packages:
  - packages/*
  - apps/*
  - examples/*
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/core@2.3.1'
  - '@modelcontextprotocol/server@2.3.1'
  - '@modelcontextprotocol/client@2.3.1'
  - vite@8.3.3
allowBuilds:
  better-sqlite3: true
  # drizzle-kit (development only) works without esbuild's install check.
  esbuild: false
overrides:
  # drizzle-kit (development only) reaches esbuild 0.18 through @esbuild-kit/core-utils, which is
  # affected by GHSA-67mh-4wv8-2f99 (fixed in 0.25.0). The esbuild API it uses is unchanged.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # One @types/node for the whole workspace, the oldest supported Node.js major (22): type
  # packages that accept any version (@types/better-sqlite3) would otherwise pull in the newest.
  '@types/node': ^22.20.5

# Dependency updates, weekly and grouped. A new release must be at least a week old before
# Dependabot proposes it (cooldown), which matches the project's rule of not taking releases
# younger than a week. Security updates are not held back: cooldown does not apply to them, and
# they come in their own group as soon as an advisory is published (enable "Dependabot security
# updates" in the repository settings; see docs/RELEASING.md).
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # An ignore rule holds back security updates too; Dependabot alerts still report advisories,
    # and these are then updated by hand.
    ignore:
      # Pinned on purpose (apps/studio): monaco-yaml 5.5.1 does not work with Monaco 0.53 or later
      # (its createWebWorker API changed). Update both together, by hand, and check the editor.
      - dependency-name: monaco-editor
      - dependency-name: monaco-yaml
      # No major updates: a newer major describes APIs that the supported Node.js lines (22, 24)
      # do not have. The types stay at 24 for now; moving them to 22 is a separate decision.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      npm-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]

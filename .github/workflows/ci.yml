# The full check chain on every push and pull request: Linux and Windows, Node 22 and 24.
# Third-party actions are pinned to full commit SHAs (the tag is in the comment); Dependabot
# proposes updates. pnpm comes from Node's corepack, at the version package.json names.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # zsh for the connect-command tests (apps/studio/web/test/connect-shells.test.tsx): the
      # first CI run skipped them on Ubuntu. KERVAN_REQUIRE_SHELLS below makes a missing shell fail.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          KERVAN_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && 'bash,zsh' || 'bash,powershell' }}
      - run: pnpm check:pack
      # Packs the packages, checks the tarballs and installs them outside the workspace.
      - run: pnpm test:pack
      - run: pnpm check:site

  # The website: Hugo at the pinned version (checksum-checked), the built-site tests that need
  # it, then every page in Chromium and the documentation's code blocks (docs/SITE.md).
  site:
    name: site (Hugo, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KERVAN_REQUIRE_HUGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the sitemap's lastmod dates come from git history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Install Hugo
        run: |
          sh scripts/site/install-hugo.sh
          echo "$HUGO_BIN_DIR" >> "$GITHUB_PATH"
        env:
          HUGO_BIN_DIR: ${{ runner.temp }}/hugo
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --project repo
      - run: pnpm site:verify --examples

  e2e:
    name: e2e (Playwright, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @kervan/studio exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Traces of failed tests only. They hold test data (made-up users, keys and tokens), never
      # a real secret.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: apps/studio/test-results
          retention-days: 7
